<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThaiBeta — Climbing Route Reviews</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧗</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#14110f;--panel:#1f1a17;--panel-2:#2a231f;--text:#f3ede7;--muted:#a99d93;--accent:#ff7a1a;--accent-2:#ffb26b;--danger:#e5484d;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:radial-gradient(circle at 20% 0%,#2b1d12 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
header{padding:28px 24px 12px;text-align:center}
header h1{margin:0;font-size:2rem}header h1 span{color:var(--accent)}
header p{margin:6px 0 0;color:var(--muted)}
.authbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:.9rem}
.authbar input{padding:8px 10px;background:var(--panel-2);border:1px solid #45382f;border-radius:10px;color:var(--text);width:190px}
main{display:grid;grid-template-columns:380px 1fr;gap:24px;padding:20px 24px 48px;max-width:1300px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid #3a2f28;border-radius:var(--radius);padding:20px}
.panel h2{margin:0 0 14px;font-size:1.2rem}
form.panel{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow-y:auto}
@media(max-width:900px){form.panel{position:static;max-height:none}}
form.panel{color-scheme:dark}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 6px}
input[type=text],select,textarea{width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid #45382f;border-radius:10px;color:var(--text);font-size:.95rem}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;background:var(--panel-2);border:1px solid #45382f;font-size:.8rem;cursor:pointer;user-select:none}
.chip.active{background:var(--accent);border-color:var(--accent);color:#1a0f05;font-weight:600}
.stars{display:flex;gap:4px;font-size:1.6rem;cursor:pointer}
.stars span{color:#4a3d34}.stars span.on{color:var(--accent-2)}
.file-drop{border:2px dashed #5a4a3f;border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.file-drop:hover{border-color:var(--accent)}
#videoPreview{width:100%;margin-top:10px;border-radius:10px;display:none}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:.95rem}
.btn-primary{width:100%;margin-top:18px;background:var(--accent);color:#1a0f05}
.btn-primary:hover,.btn-sm:hover{background:var(--accent-2)}
.btn-primary:disabled{opacity:.5;cursor:wait}
.btn-sm{background:var(--accent);color:#1a0f05;padding:8px 14px}
.btn-sm.alt{background:var(--panel-2);color:var(--text);border:1px solid #45382f}
.btn-ghost{background:transparent;color:var(--danger);border:1px solid #5a2a2c;padding:6px 10px;font-size:.8rem}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}
.stats{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid #3a2f28;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card video{width:100%;max-height:340px;background:#000}
.no-video{padding:30px;text-align:center;color:var(--muted);background:#18130f;font-size:.85rem}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-title{display:flex;justify-content:space-between;align-items:start;gap:8px}
.card-title h3{margin:0;font-size:1.1rem}
.grade{background:var(--accent);color:#1a0f05;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap}
.meta{color:var(--muted);font-size:.85rem;line-height:1.5}
.hold-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid #fff5}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#3a2a1d;color:var(--accent-2);font-size:.75rem;padding:3px 8px;border-radius:999px}
.review-text{white-space:pre-wrap;line-height:1.5;font-size:.93rem}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid #3a2f28;font-size:.8rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1a0f05;padding:12px 20px;border-radius:10px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>🧗 Thai<span>Beta</span></h1>
  <p>Review routes, share beta videos — climbing gyms across Thailand</p>
  <div class="authbar" id="authbar"></div>
</header>

<main>
  <form class="panel" id="reviewForm" autocomplete="off">
    <h2>Post a route review</h2>

    <label for="reviewer">Your name</label>
    <input type="text" id="reviewer" placeholder="e.g. Jarukit" required />

    <div class="row">
      <div><label for="city">City / Province</label><select id="city" required></select></div>
      <div><label for="gym">Gym</label><select id="gym" required></select><input type="text" id="gymOther" placeholder="Type your gym name" style="display:none;margin-top:8px" /></div>
    </div>

    <label for="area">Where in the gym (wall / sector)</label>
    <input type="text" id="area" placeholder="e.g. Cave wall, left of the arete" required />

    <label for="routeName">Route name</label>
    <input type="text" id="routeName" placeholder="e.g. Mango Sticky Crimps" required />

    <div class="row">
      <div><label for="type">Climb type</label>
        <select id="type" required><option>Boulder</option><option>Top rope</option><option>Lead</option><option>Auto-belay</option></select></div>
      <div><label for="grade">Grade</label><select id="grade" required></select></div>
    </div>

    <label for="holdColor">Hold colour</label>
    <select id="holdColor">
      <option value="">— Select —</option>
      <option value="#e5484d">Red</option><option value="#ff7a1a">Orange</option><option value="#f5d90a">Yellow</option>
      <option value="#30a46c">Green</option><option value="#3e63dd">Blue</option><option value="#8e4ec6">Purple</option>
      <option value="#e93d82">Pink</option><option value="#111111">Black</option><option value="#f5f5f5">White</option>
      <option value="#8d6e63">Brown</option>
    </select>

    <label>Route style (select all that apply)</label>
    <div class="chips" id="styleChips"></div>

    <label>Rating</label>
    <div class="stars" id="stars"></div>

    <label for="reviewText">Review</label>
    <textarea id="reviewText" placeholder="How did it feel? Crux, sandbagged or soft, tips for the sequence..." required></textarea>

    <label>Beta video</label>
    <div class="file-drop" id="fileDrop">
      📹 Click or drop a video here<br><small>MP4 / MOV / WebM · max 50 MB</small>
      <input type="file" id="video" accept="video/*" hidden />
    </div>
    <video id="videoPreview" controls></video>

    <button type="submit" class="btn-primary" id="submitBtn">Publish review</button>
  </form>

  <section>
    <div class="filters">
      <input type="text" id="q" placeholder="🔍 Search route, gym, area, review..." />
      <select id="fCity"><option value="">All cities</option></select>
      <select id="fType"><option value="">All types</option><option>Boulder</option><option>Top rope</option><option>Lead</option><option>Auto-belay</option></select>
      <select id="fStyle"><option value="">All styles</option></select>
      <select id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="rating">Top rated</option></select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ---------- Supabase config (replace with your own) ---------- */
const SUPABASE_URL = "https://obokvhahkdcbgipompxy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kxEo3dqrte7MT42_9EXwIw_o_Gdmp1Q";   // anon key only, never service_role
const BUCKET = "videos";
const GYMS = ["Stonegoat The Parq","Stonegoat S69","Balance Rama 9","Balance Prime","Urban Playground","Rock Domain","Climb Central","Beat Active","Boulder Planet"];
const MAX_VIDEO_MB = 50;                            // Supabase free plan limit per file

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let user = null, cache = [];

/* ---------- Config ---------- */
const CITIES = ["Bangkok","Chiang Mai","Phuket","Krabi","Pattaya / Chonburi","Hua Hin","Khon Kaen","Nonthaburi","Other"];
const STYLES = ["Crimpy","Slopers","Pinches","Jugs","Pockets","Dyno","Overhang","Slab","Vertical","Roof","Compression","Balance","Technical","Powerful","Endurance","Heel hooks","Toe hooks","Coordination"];
const FRENCH = ["4","5a","5b","5c","6a","6a+","6b","6b+","6c","6c+","7a","7a+","7b","7b+","7c","7c+","8a","8a+","8b","8b+"];
const GRADES = {"Boulder":["VB","V0","V1","V2","V3","V4","V5","V6","V7","V8","V9","V10+"],"Top rope":FRENCH,"Lead":FRENCH,"Auto-belay":FRENCH};

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}

/* ---------- Auth ---------- */
function drawAuth(){
  $("authbar").innerHTML = user
    ? `<span>👤 ${esc(user.email)}</span><button class="btn-sm alt" id="outBtn">Log out</button>`
    : `<input type="email" id="em" placeholder="Email"><input type="password" id="pw" placeholder="Password (6+ chars)"><button class="btn-sm" id="inBtn">Log in</button><button class="btn-sm alt" id="upBtn">Sign up</button>`;
}
$("authbar").addEventListener("click", async e => {
  const id = e.target.id;
  if (id === "outBtn") return void (await sb.auth.signOut());
  if (id !== "inBtn" && id !== "upBtn") return;
  const email = $("em").value.trim(), password = $("pw").value;
  const { error } = id === "inBtn"
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  if (error) return toast(error.message);
  if (id === "upBtn") toast("Signed up! Check your email if confirmation is required.");
});
sb.auth.onAuthStateChange((_event, session) => {
  user = session?.user ?? null;
  setTimeout(() => { drawAuth(); render(); }, 0);   // avoid calling Supabase inside the callback
});

/* ---------- Form setup ---------- */
let rating = 0, selectedStyles = new Set(), videoFile = null;

$("city").innerHTML = CITIES.map(c => `<option>${c}</option>`).join("");
$("fCity").innerHTML += CITIES.map(c => `<option>${c}</option>`).join("");
$("fStyle").innerHTML += STYLES.map(s => `<option>${s}</option>`).join("");
$("gym").innerHTML = `<option value="">— Select gym —</option>` + GYMS.map(g => `<option>${g}</option>`).join("") + `<option value="__other">Other (type your own)</option>`;
function toggleGymOther(){
  const o = $("gym").value === "__other";
  $("gymOther").style.display = o ? "block" : "none";
  $("gymOther").required = o;
  if (!o) $("gymOther").value = "";
}
$("gym").addEventListener("change", toggleGymOther);

function fillGrades(){ $("grade").innerHTML = GRADES[$("type").value].map(g => `<option>${g}</option>`).join(""); }
$("type").addEventListener("change", fillGrades); fillGrades();

$("styleChips").innerHTML = STYLES.map(s => `<span class="chip" data-style="${s}">${s}</span>`).join("");
$("styleChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  const s = chip.dataset.style;
  selectedStyles.has(s) ? selectedStyles.delete(s) : selectedStyles.add(s);
  chip.classList.toggle("active");
});

function drawStars(){ $("stars").innerHTML = [1,2,3,4,5].map(i => `<span data-v="${i}" class="${i <= rating ? "on" : ""}">★</span>`).join(""); }
$("stars").addEventListener("click", e => { if (e.target.dataset.v) { rating = +e.target.dataset.v; drawStars(); } });
drawStars();

function setVideo(file){
  if (!file) return;
  if (!file.type.startsWith("video/")) return toast("Please choose a video file");
  if (file.size > MAX_VIDEO_MB * 1024 * 1024) return toast(`Video must be under ${MAX_VIDEO_MB} MB`);
  videoFile = file;
  const p = $("videoPreview"); p.src = URL.createObjectURL(file); p.style.display = "block";
}
$("fileDrop").addEventListener("click", () => $("video").click());
$("video").addEventListener("change", e => setVideo(e.target.files[0]));
$("fileDrop").addEventListener("dragover", e => e.preventDefault());
$("fileDrop").addEventListener("drop", e => { e.preventDefault(); setVideo(e.dataTransfer.files[0]); });

/* ---------- Submit (upload video → insert row) ---------- */
$("reviewForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!user) return toast("Please log in first (top of page)");
  if (!rating) return toast("Please give the route a rating ★");
  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Publishing...";
  try {
    let video_path = null;
    if (videoFile) {
      const ext = (videoFile.name.split(".").pop() || "mp4").toLowerCase();
      video_path = `${user.id}/${crypto.randomUUID()}.${ext}`;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(video_path, videoFile, { contentType: videoFile.type });
      if (upErr) throw upErr;
    }
    const hc = $("holdColor");
    const { error } = await sb.from("reviews").insert({
      reviewer: $("reviewer").value.trim(),
      city: $("city").value,
      gym: $("gym").value === "__other" ? $("gymOther").value.trim() : $("gym").value,
      area: $("area").value.trim(),
      route_name: $("routeName").value.trim(),
      type: $("type").value,
      grade: $("grade").value,
      hold_color: hc.value || null,
      hold_color_name: hc.value ? hc.selectedOptions[0].text : null,
      styles: [...selectedStyles],
      rating,
      review_text: $("reviewText").value.trim(),
      video_path
    });
    if (error) throw error;
    toast("Review published! 🧗");
    resetForm();
    render();
  } catch (err) {
    console.error(err);
    toast("Could not publish: " + (err.message || "unknown error"));
  } finally {
    btn.disabled = false; btn.textContent = "Publish review";
  }
});

function resetForm(){
  const keepName = $("reviewer").value;
  $("reviewForm").reset(); $("reviewer").value = keepName;
  fillGrades(); toggleGymOther(); rating = 0; drawStars(); selectedStyles.clear();
  document.querySelectorAll(".chip.active").forEach(c => c.classList.remove("active"));
  videoFile = null; $("videoPreview").removeAttribute("src"); $("videoPreview").style.display = "none";
}

/* ---------- Load + render ---------- */
async function loadReviews(){
  const { data, error } = await sb.from("reviews").select("*").order("created_at", { ascending: false }).limit(300);
  if (error) { console.error(error); toast("Could not load reviews: " + error.message); return []; }
  return data.map(r => ({
    ...r,
    routeName: r.route_name, holdColor: r.hold_color, holdColorName: r.hold_color_name,
    text: r.review_text, styles: r.styles || [], createdAt: Date.parse(r.created_at),
    video: r.video_path ? sb.storage.from(BUCKET).getPublicUrl(r.video_path).data.publicUrl : null
  }));
}

async function render(){
  cache = await loadReviews();
  const all = cache;


  const q = $("q").value.toLowerCase().trim();
  const fCity = $("fCity").value, fType = $("fType").value, fStyle = $("fStyle").value, sort = $("sort").value;

  const list = all.filter(r =>
    (!fCity || r.city === fCity) && (!fType || r.type === fType) && (!fStyle || r.styles.includes(fStyle)) &&
    (!q || [r.routeName, r.gym, r.area, r.text, r.reviewer].join(" ").toLowerCase().includes(q))
  ).sort((a, b) =>
    sort === "old" ? a.createdAt - b.createdAt :
    sort === "rating" ? b.rating - a.rating || b.createdAt - a.createdAt :
    b.createdAt - a.createdAt);

  const avg = list.length ? (list.reduce((s, r) => s + r.rating, 0) / list.length).toFixed(1) : "–";
  $("stats").textContent = `${list.length} review(s) · ${list.filter(r => r.video).length} beta video(s) · avg rating ${avg}★`;

  if (!list.length) { $("feed").innerHTML = `<div class="empty">No reviews yet. Send a route and post the first beta! 💪</div>`; return; }

  $("feed").innerHTML = list.map(r => {
    const media = r.video ? `<video src="${esc(r.video)}" controls preload="metadata"></video>` : `<div class="no-video">No beta video uploaded</div>`;
    const hold = r.holdColor ? `<span class="hold-dot" style="background:${esc(r.holdColor)}"></span>${esc(r.holdColorName)} holds · ` : "";
    const mine = user && r.user_id === user.id;
    return `
      <article class="card">
        ${media}
        <div class="card-body">
          <div class="card-title"><h3>${esc(r.routeName)}</h3><span class="grade">${esc(r.grade)}</span></div>
          <div class="meta">📍 <strong>${esc(r.gym)}</strong>, ${esc(r.city)}<br>🧱 ${esc(r.area)}<br>${hold}${esc(r.type)}</div>
          <div style="color:var(--accent-2)">${"★".repeat(r.rating)}<span style="color:#4a3d34">${"★".repeat(5 - r.rating)}</span></div>
          ${r.styles.length ? `<div class="tags">${r.styles.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>` : ""}
          <div class="review-text">${esc(r.text)}</div>
          <div class="card-foot">
            <span>by ${esc(r.reviewer)} · ${new Date(r.createdAt).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</span>
            ${mine ? `<button class="btn-ghost" data-del="${esc(r.id)}">Delete</button>` : ""}
          </div>
        </div>
      </article>`;
  }).join("");
}

$("feed").addEventListener("click", async e => {
  const id = e.target.dataset.del;
  if (!id || !confirm("Delete this review?")) return;
  const rv = cache.find(r => r.id === id);
  const { error } = await sb.from("reviews").delete().eq("id", id);
  if (error) return toast("Delete failed: " + error.message);
  if (rv?.video_path) await sb.storage.from(BUCKET).remove([rv.video_path]);
  toast("Review deleted");
  render();
});

["q","fCity","fType","fStyle","sort"].forEach(id => $(id).addEventListener(id === "q" ? "input" : "change", render));
</script>
</body>
</html>
