<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14110f" />
<meta name="description" content="Review climbing routes and share beta videos from gyms across Thailand." />
<title>ThaiBeta — Climbing Route Reviews</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== Sidebar ===================== -->
<aside id="tbSidebar" aria-label="Account menu">
  <div class="tb-me">
    <img id="tbSideAvatar" class="tb-avatar" alt="">
    <div><div id="tbSideName" class="tb-side-name">Guest</div><span class="tb-muted">ThaiBeta</span></div>
  </div>
  <button type="button" class="tb-nav active" id="navReviews" data-action="view-reviews">🧗 Reviews</button>
  <button type="button" class="tb-nav" id="navChat" data-action="view-chat">💬 Chat</button>
  <button type="button" class="tb-nav" data-action="profile">👤 Profile</button>
  <button type="button" class="tb-nav" data-action="settings">⚙️ Settings</button>
  <button type="button" class="tb-nav login" id="tbLoginBtn" data-action="login">🔑 Log in</button>
  <button type="button" class="tb-nav logout" id="tbLogoutBtn" data-action="logout" hidden>Log out</button>
</aside>
<button type="button" id="tbToggle" aria-label="Menu" aria-controls="tbSidebar" aria-expanded="false" data-action="toggle-sidebar">☰</button>
<div id="tbScrim" data-action="close-sidebar"></div>

<!-- Profile popup -->
<div id="tbProfileModal" class="tb-modal">
  <div class="tb-card" role="dialog" aria-modal="true" aria-labelledby="tbProfileTitle" tabindex="-1">
    <button type="button" class="tb-close" data-action="close" data-target="tbProfileModal" aria-label="Close">×</button>
    <h2 id="tbProfileTitle">Profile</h2>
    <div class="tb-profile-head">
      <img id="tbProfAvatar" class="tb-avatar" alt="">
      <div style="flex:1;min-width:200px">
        <div id="tbProfName" class="tb-prof-name"></div>
        <div id="tbAvatarEdit">
          <label for="tbAvatarFile">Change profile photo (max 5 MB)</label>
          <input type="file" id="tbAvatarFile" accept="image/*">
          <div id="tbAvatarMsg" class="tb-msg" role="status"></div>
        </div>
      </div>
    </div>
    <h3 id="tbVidsTitle">My beta videos</h3>
    <div id="tbMyVideos" class="tb-grid"></div>
  </div>
</div>

<!-- Settings popup -->
<div id="tbSettingsModal" class="tb-modal">
  <div class="tb-card" role="dialog" aria-modal="true" aria-labelledby="tbSettingsTitle" tabindex="-1">
    <button type="button" class="tb-close" data-action="close" data-target="tbSettingsModal" aria-label="Close">×</button>
    <h2 id="tbSettingsTitle">Settings</h2>

    <form id="tbNameForm">
      <h3>Username</h3>
      <label for="tbNewName">New username (3–30 characters)</label>
      <input type="text" id="tbNewName" maxlength="30" autocomplete="nickname">
      <button type="submit" class="btn-sm" id="tbNameBtn" style="margin-top:12px">Save username</button>
      <div id="tbNameMsg" class="tb-msg" role="status"></div>
    </form>

    <form id="tbPwForm">
      <h3>Password</h3>
      <input type="email" id="tbPwEmail" autocomplete="username" hidden>
      <label for="tbCurPw">Current password</label>
      <input id="tbCurPw" type="password" autocomplete="current-password" required>
      <label for="tbNewPw">New password (6+ characters)</label>
      <input id="tbNewPw" type="password" autocomplete="new-password" required minlength="6">
      <label for="tbNewPw2">Confirm new password</label>
      <input id="tbNewPw2" type="password" autocomplete="new-password" required minlength="6">
      <button type="submit" class="btn-sm" id="tbPwBtn" style="margin-top:12px">Change password</button>
      <div id="tbPwMsg" class="tb-msg" role="status"></div>
    </form>
  </div>
</div>

<!-- Log in / Sign up popup -->
<div id="tbLoginModal" class="tb-modal">
  <form class="tb-login" id="tbLoginForm" role="dialog" aria-modal="true" aria-labelledby="tbLoginTitle" tabindex="-1">
    <button type="button" class="tb-close" data-action="dismiss-login" title="Browse without logging in" aria-label="Close and browse as guest">×</button>
    <h2 id="tbLoginTitle">Log in</h2>
    <input type="text" id="tbLoginName" placeholder="Username" maxlength="30" autocomplete="nickname" aria-label="Username" hidden>
    <input type="email" id="tbLoginEmail" placeholder="Email" required autocomplete="email" aria-label="Email">
    <input type="password" id="tbLoginPw" placeholder="Password" required minlength="6" autocomplete="current-password" aria-label="Password">
    <button type="submit" class="tb-login-btn" id="tbLoginSubmit">Log in</button>
    <div id="tbLoginMsg" class="tb-msg" role="status"></div>
    <button type="button" class="tb-login-switch" id="tbLoginSwitch" data-action="switch-auth">or, sign up</button>
  </form>
</div>

<header>
  <a class="brand" href="./" aria-label="ThaiBeta home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10C4.5 6 8.3 3.4 12.7 4c4.6.6 7.6 3.8 6.7 8-.8 3.9-3.9 8-8.4 8C7 20 4.5 14.6 4.5 10Z" fill="var(--accent)"/><circle cx="9.8" cy="10.2" r="1.7" fill="var(--bg)"/><circle cx="14.6" cy="13.4" r="1.3" fill="var(--bg)"/></svg>
    ThaiBeta
  </a>
  <div class="hero">
    <h1>Find your next route.</h1>
    <p>Reviews and beta videos from climbers at gyms across Thailand.</p>
  </div>
</header>

<main>
  <form class="panel" id="reviewForm" autocomplete="off">
    <h2><button type="button" class="form-toggle" id="formToggle" aria-expanded="true" aria-controls="formBody" data-action="toggle-form">Post a route review<span class="chev" aria-hidden="true"></span></button></h2>
    <p class="posting-as" id="postingAs"></p>

    <div id="formBody">
      <div class="row">
        <div><label for="city">City / Province</label><select id="city" required></select></div>
        <div>
          <label for="gym">Gym</label><select id="gym" required></select>
          <input type="text" id="gymOther" placeholder="Type your gym name" maxlength="80" aria-label="Gym name" hidden style="margin-top:8px" />
        </div>
      </div>

      <label for="area">Where in the gym (wall / sector)</label>
      <input type="text" id="area" placeholder="e.g. Cave wall, left of the arete" maxlength="120" required />

      <label for="routeName">Route name</label>
      <input type="text" id="routeName" placeholder="e.g. Mango Sticky Crimps" maxlength="120" required />

      <div class="row">
        <div><label for="type">Climb type</label><select id="type" required></select></div>
        <div><label for="grade">Grade</label><select id="grade" required></select></div>
      </div>

      <span class="label" id="holdLabel">Hold colour</span>
      <div class="chips" id="holdChips" role="group" aria-labelledby="holdLabel"></div>

      <span class="label" id="styleLabel">Route style (select all that apply)</span>
      <div class="chips" id="styleChips" role="group" aria-labelledby="styleLabel"></div>

      <span class="label" id="ratingLabel">Rating</span>
      <div class="rating-row">
        <div class="stars" id="stars" role="group" aria-labelledby="ratingLabel"></div>
        <span id="ratingText" class="tb-muted"></span>
      </div>

      <label for="reviewText">Review</label>
      <textarea id="reviewText" maxlength="3000" placeholder="How did it feel? Crux, sandbagged or soft, tips for the sequence..." required></textarea>

      <span class="label">Beta video (required)</span>
      <button type="button" class="file-drop" id="fileDrop">📹 Choose or drop a video<br><small>MP4 / MOV / WebM · max 50 MB</small></button>
      <input type="file" id="video" accept="video/*" hidden />
      <div class="picked" id="videoPicked" hidden><span id="videoName"></span><button type="button" class="btn-link" data-action="remove-video">Remove</button></div>
      <video id="videoPreview" controls playsinline hidden></video>

      <button type="submit" class="btn-primary" id="submitBtn">Publish review</button>
    </div>
  </form>

  <section aria-label="Reviews">
    <div class="filters">
      <input type="search" id="q" placeholder="🔍 Search route, gym, grade, review..." aria-label="Search reviews" />
      <select id="fCity" aria-label="Filter by city"><option value="">All cities</option></select>
      <select id="fGym" aria-label="Filter by gym"><option value="">All gyms</option></select>
      <select id="fType" aria-label="Filter by climb type"><option value="">All types</option></select>
      <select id="fStyle" aria-label="Filter by style"><option value="">All styles</option></select>
      <select id="sort" aria-label="Sort reviews"><option value="new">Newest</option><option value="old">Oldest</option><option value="rating">Top rated</option></select>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<!-- ===================== Chat ===================== -->
<section id="chatView" aria-label="Chat">
  <nav class="ch-side" id="chList" aria-label="Channels"></nav>
  <div class="ch-main">
    <div class="ch-head"><strong><span class="hash">#</span><span id="chName">general</span></strong><span id="chDesc" class="tb-muted"></span></div>
    <div class="ch-msgs" id="chMsgs" aria-live="polite"></div>
    <div class="ch-compose" id="chCompose"></div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
