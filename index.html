<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ThaiBeta — Climbing Route Reviews</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧗</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#14110f;--panel:#1f1a17;--panel-2:#2a231f;--text:#f3ede7;--muted:#a99d93;--accent:#ff7a1a;--accent-2:#ffb26b;--danger:#e5484d;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:radial-gradient(circle at 20% 0%,#2b1d12 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
header{padding:28px 24px 12px;text-align:center}
header h1{margin:0;font-size:2rem}header h1 span{color:var(--accent)}
header p{margin:6px 0 0;color:var(--muted)}
main{display:grid;grid-template-columns:380px 1fr;gap:24px;padding:20px 24px 48px;margin:0}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid #3a2f28;border-radius:var(--radius);padding:20px}
.panel h2{margin:0 0 14px;font-size:1.2rem}
form.panel{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow-y:auto}
@media(max-width:900px){form.panel{position:static;max-height:none}}
form.panel{color-scheme:dark}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 6px}
input[type=text],select,textarea{width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid #45382f;border-radius:10px;color:var(--text);font-size:.95rem}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;background:var(--panel-2);border:1px solid #45382f;font-size:.8rem;cursor:pointer;user-select:none}
.chip.active{background:var(--accent);border-color:var(--accent);color:#1a0f05;font-weight:600}
.stars{display:flex;gap:4px;font-size:1.6rem;cursor:pointer}
.stars span{color:#4a3d34}.stars span.on{color:var(--accent-2)}
.file-drop{border:2px dashed #5a4a3f;border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.file-drop:hover{border-color:var(--accent)}
#videoPreview{width:100%;margin-top:10px;border-radius:10px;display:none}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:.95rem}
.btn-primary{width:100%;margin-top:18px;background:var(--accent);color:#1a0f05}
.btn-primary:hover,.btn-sm:hover{background:var(--accent-2)}
.btn-primary:disabled{opacity:.5;cursor:wait}
.btn-sm{background:var(--accent);color:#1a0f05;padding:8px 14px}
.btn-sm.alt{background:var(--panel-2);color:var(--text);border:1px solid #45382f}
.btn-ghost{background:transparent;color:var(--danger);border:1px solid #5a2a2c;padding:6px 10px;font-size:.8rem}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}
.stats{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid #3a2f28;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card video{width:100%;max-height:340px;background:#000}
.no-video{padding:30px;text-align:center;color:var(--muted);background:#18130f;font-size:.85rem}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-title{display:flex;justify-content:space-between;align-items:start;gap:8px}
.card-title h3{margin:0;font-size:1.1rem}
.grade{background:var(--accent);color:#1a0f05;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap}
.meta{color:var(--muted);font-size:.85rem;line-height:1.5}
.hold-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid #fff5}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#3a2a1d;color:var(--accent-2);font-size:.75rem;padding:3px 8px;border-radius:999px}
.review-text{white-space:pre-wrap;line-height:1.5;font-size:.93rem}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid #3a2f28;font-size:.8rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1a0f05;padding:12px 20px;border-radius:10px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;z-index:2000}
.toast.show{opacity:1}

/* ===================== NEW: Sidebar + Profile + Settings ===================== */
#tbSidebar{position:fixed;top:0;left:0;height:100vh;width:260px;background:var(--panel);border-right:1px solid #3a2f28;display:flex;flex-direction:column;gap:6px;padding:16px;z-index:1000;transform:translateX(-100%);transition:transform .25s}
#tbSidebar.open{transform:translateX(0)}
#tbToggle{position:fixed;top:14px;left:14px;z-index:1001;background:var(--panel);color:var(--text);border:1px solid #3a2f28;padding:8px 12px;font-size:1.1rem;transition:left .25s}
#tbSidebar.open + #tbToggle{left:274px}
.tb-me{display:flex;align-items:center;gap:10px;padding:8px 4px 16px;border-bottom:1px solid #3a2f28;margin:44px 0 8px}
.tb-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--panel-2);flex:none}
.tb-nav{background:none;color:var(--text);text-align:left;padding:10px 12px;font-weight:600}
.tb-nav:hover{background:var(--panel-2)}
.tb-nav.logout{margin-top:auto;color:var(--danger)}
.tb-modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.tb-modal.show{display:flex}
.tb-card{background:var(--panel);border:1px solid #3a2f28;border-radius:var(--radius);width:100%;max-width:680px;max-height:90vh;overflow:auto;padding:22px;color-scheme:dark}
.tb-card h2{margin:0 0 14px;font-size:1.3rem}
.tb-card h3{margin:22px 0 4px;font-size:1rem;color:var(--accent-2)}
.tb-close{float:right;background:none;color:var(--muted);font-size:1.5rem;padding:0 6px;line-height:1}
.tb-profile-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tb-profile-head .tb-avatar{width:90px;height:90px}
.tb-card input[type=password],.tb-card input[type=file]{width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid #45382f;border-radius:10px;color:var(--text);font-size:.95rem}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:8px}
.tb-grid video{width:100%;border-radius:10px;background:#000;max-height:260px}
.tb-grid small,.tb-muted{color:var(--muted);font-size:.8rem}
.tb-vid{position:relative}
.tb-vid-info{display:none}
.tb-vid:fullscreen{background:#000;display:flex;align-items:center;justify-content:center}
.tb-vid:-webkit-full-screen{background:#000;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.tb-vid:-webkit-full-screen video{width:100%;height:100%;max-height:none;object-fit:contain}
.tb-vid:-webkit-full-screen .tb-vid-info{display:block;position:absolute;left:24px;bottom:80px;background:rgba(0,0,0,.6);color:#fff;padding:12px 16px;border-radius:12px;line-height:1.5}
.tb-vid:fullscreen video{width:100%;height:100%;max-height:none;border-radius:0;object-fit:contain}
.tb-vid video::-webkit-media-controls-fullscreen-button{display:none}
.tb-fs{position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;padding:6px 9px;font-size:1rem;line-height:1;border-radius:8px}
.tb-fs:hover{background:rgba(0,0,0,.8)}
.tb-vid:fullscreen .tb-fs{top:16px;right:16px;font-size:1.3rem}
.card .tb-vid{background:#000}
.tb-vid:fullscreen .tb-vid-info{display:block;position:absolute;left:24px;bottom:80px;max-width:min(520px,80vw);background:rgba(0,0,0,.6);color:#fff;padding:12px 16px;border-radius:12px;line-height:1.5;font-size:1rem;pointer-events:none}
.tb-vid-info b{font-size:1.2rem}
.tb-msg{font-size:.85rem;margin-top:8px;min-height:1em}
.tb-msg.err{color:var(--danger)}.tb-msg.ok{color:#5ad48a}
.tb-nav.login{margin-top:auto;color:var(--accent)}
.tb-login{background:var(--panel);color:var(--text);border:1px solid #3a2f28;border-radius:var(--radius);width:100%;max-width:300px;padding:22px 22px 14px;box-shadow:0 10px 40px rgba(0,0,0,.6);position:relative;color-scheme:dark}
.tb-login h2{margin:0 0 16px;font-size:1.9rem;font-weight:800;color:var(--text)}
.tb-login input{width:100%;padding:10px 12px;margin-bottom:12px;background:var(--panel-2);border:1px solid #45382f;border-radius:10px;color:var(--text);font-size:.9rem}
.tb-login input::placeholder{color:var(--muted)}
.tb-login input:focus{outline:2px solid var(--accent);border-color:transparent}
.tb-login-btn{width:100%;background:var(--accent);color:#1a0f05;border-radius:10px;padding:11px;font-weight:700;margin-top:4px}
.tb-login-btn:hover{background:var(--accent-2)}
.tb-login-btn:disabled{opacity:.6;cursor:wait}
.tb-login-switch{display:block;margin:10px auto 0;background:none;color:var(--muted);padding:4px 8px;font-weight:400;font-size:.85rem;border-radius:8px}
.tb-login-switch:hover{color:var(--accent-2);text-decoration:underline}
.tb-login-switch:focus{outline:none}.tb-login-switch:focus-visible{outline:2px solid var(--accent)}
.tb-login .tb-close{position:absolute;top:8px;right:8px;color:var(--muted)}
body.tb-gated > :not(#tbLoginModal):not(.toast):not(script){filter:blur(6px);pointer-events:none;user-select:none}
body.tb-gated #tbLoginModal{background:rgba(10,8,7,.7)}
body.tb-gated .tb-login .tb-close{display:none}
.by-user{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;background:none;border:0;padding:0;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.by-user:hover span{color:var(--accent-2);text-decoration:underline}
.by-user img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--panel-2);border:1px solid #45382f}
/* ===================== Responsive: iPhone, Samsung, iPad, MacBook, Windows PC ===================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,.chip,.stars span,.file-drop{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#tbSidebar{height:100dvh;width:min(260px,82vw);padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#tbToggle{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left))}
#tbSidebar.open + #tbToggle{left:calc(min(260px,82vw) + 14px)}
.tb-card{max-height:90dvh}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters > *{flex:1 1 150px;min-width:0}
.filters #q{flex:3 1 260px}
.feed{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
.card video{display:block}
.card-title h3,.review-text,.meta{overflow-wrap:anywhere}
.card-foot{flex-wrap:wrap;gap:8px}
/* Desktop/laptop/iPad landscape: keep "Post a route review" in view while scrolling */
@media (min-width:901px){
  main{min-height:100dvh;padding-bottom:0}
  main > section{padding-bottom:48px}
  form.panel{top:16px;max-height:calc(100dvh - 32px)}
}
/* Small laptops + iPad landscape */
@media (max-width:1100px){main{grid-template-columns:330px 1fr;gap:18px}}
/* iPad portrait, Galaxy Tab, phones: form above the feed */
@media (max-width:900px){main{grid-template-columns:1fr}}
/* Phones */
@media (max-width:600px){
  header{padding:22px 60px 8px}
  header h1{font-size:1.6rem}
  header p{font-size:.88rem}
  main{padding:12px 12px 32px;gap:16px}
  .panel{padding:16px}
  .tb-modal{padding:10px}
  .tb-card{padding:18px}
  .tb-profile-head .tb-avatar{width:72px;height:72px}
  .tb-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .filters > *{flex-basis:calc(50% - 5px)}
  .filters #q{flex-basis:100%}
  .tb-vid:fullscreen .tb-vid-info{left:12px;bottom:70px;font-size:.9rem}
}
/* Touch screens: stop iPhone/iPad/Samsung zooming in on fields, bigger tap targets */
@media (pointer:coarse){
  input,select,textarea{font-size:16px !important}
  .chip{padding:8px 12px}
  .tb-nav{padding:12px}
}
/* Short laptop screens (e.g. 13" MacBook, small Windows laptops) */
@media (min-width:901px) and (max-height:760px){header{padding:16px 24px 8px}}
</style>
</head>
<body class="tb-gated">

<!-- ===================== NEW: Sidebar ===================== -->
<aside id="tbSidebar">
  <div class="tb-me">
    <img id="tbSideAvatar" class="tb-avatar" alt="">
    <div><div id="tbSideName" style="font-weight:700">Guest</div><span class="tb-muted">ThaiBeta</span></div>
  </div>
  <button class="tb-nav" onclick="tbOpen('tbProfileModal')">👤 Profile</button>
  <button class="tb-nav" onclick="tbOpen('tbSettingsModal')">⚙️ Settings</button>
  <button class="tb-nav login" id="tbLoginBtn" onclick="tbOpenLogin()">🔑 Log in</button>
  <button class="tb-nav logout" id="tbLogoutBtn" onclick="tbLogout()">Log out</button>
</aside>
<button id="tbToggle" aria-label="Menu" onclick="document.getElementById('tbSidebar').classList.toggle('open')">☰</button>

<!-- Profile popup -->
<div id="tbProfileModal" class="tb-modal" onclick="if(event.target===this)tbClose(this.id)">
  <div class="tb-card">
    <button class="tb-close" onclick="tbClose('tbProfileModal')">×</button>
    <h2>Profile</h2>
    <div class="tb-profile-head">
      <img id="tbProfAvatar" class="tb-avatar" alt="">
      <div style="flex:1;min-width:200px">
        <div id="tbProfName" style="font-size:1.3rem;font-weight:800"></div>
        <div id="tbAvatarEdit">
          <label for="tbAvatarFile">Change profile photo (max 5 MB)</label>
          <input type="file" id="tbAvatarFile" accept="image/*">
          <div id="tbAvatarMsg" class="tb-msg"></div>
        </div>
      </div>
    </div>
    <h3 id="tbVidsTitle">My beta videos</h3>
    <div id="tbMyVideos" class="tb-grid"><small>Loading…</small></div>
  </div>
</div>

<!-- Settings popup -->
<div id="tbSettingsModal" class="tb-modal" onclick="if(event.target===this)tbClose(this.id)">
  <div class="tb-card">
    <button class="tb-close" onclick="tbClose('tbSettingsModal')">×</button>
    <h2>Settings</h2>

    <h3>Username</h3>
    <label for="tbNewName">New username (3–30 characters)</label>
    <input type="text" id="tbNewName" maxlength="30">
    <button class="btn-sm" style="margin-top:12px" onclick="tbSaveUsername()">Save username</button>
    <div id="tbNameMsg" class="tb-msg"></div>

    <h3>Password</h3>
    <label for="tbCurPw">Current password</label>
    <input id="tbCurPw" type="password" autocomplete="current-password">
    <label for="tbNewPw">New password (6+ characters)</label>
    <input id="tbNewPw" type="password" autocomplete="new-password">
    <label for="tbNewPw2">Confirm new password</label>
    <input id="tbNewPw2" type="password" autocomplete="new-password">
    <button class="btn-sm" style="margin-top:12px" onclick="tbChangePassword()">Change password</button>
    <div id="tbPwMsg" class="tb-msg"></div>
  </div>
</div>
<!-- Log in / Sign up popup -->
<div id="tbLoginModal" class="tb-modal" onclick="if(event.target===this)tbClose(this.id)">
  <form class="tb-login" id="tbLoginForm">
    <button type="button" class="tb-close" onclick="tbClose('tbLoginModal')">×</button>
    <h2 id="tbLoginTitle">Log in</h2>
    <input type="text" id="tbLoginName" placeholder="Username" maxlength="30" style="display:none" autocomplete="username">
    <input type="email" id="tbLoginEmail" placeholder="Email" required autocomplete="email">
    <input type="password" id="tbLoginPw" placeholder="Password" required minlength="6" autocomplete="current-password">
    <button type="submit" class="tb-login-btn" id="tbLoginSubmit">Log in</button>
    <div id="tbLoginMsg" class="tb-msg"></div>
    <button type="button" class="tb-login-switch" id="tbLoginSwitch" onclick="tbLoginMode(!tbSignUp)">or, sign up</button>
  </form>
</div>
<!-- ===================== END NEW ===================== -->

<header>
  <h1>🧗 Thai<span>Beta</span></h1>
  <p>Review routes, share beta videos — climbing gyms across Thailand</p>
</header>

<main>
  <form class="panel" id="reviewForm" autocomplete="off">
    <h2>Post a route review</h2>

    <label for="reviewer">Your name</label>
    <input type="text" id="reviewer" placeholder="e.g. Jarukit" required />

    <div class="row">
      <div><label for="city">City / Province</label><select id="city" required></select></div>
      <div><label for="gym">Gym</label><select id="gym" required></select><input type="text" id="gymOther" placeholder="Type your gym name" style="display:none;margin-top:8px" /></div>
    </div>

    <label for="area">Where in the gym (wall / sector)</label>
    <input type="text" id="area" placeholder="e.g. Cave wall, left of the arete" required />

    <label for="routeName">Route name</label>
    <input type="text" id="routeName" placeholder="e.g. Mango Sticky Crimps" required />

    <div class="row">
      <div><label for="type">Climb type</label>
        <select id="type" required><option>Boulder</option><option>Top rope</option><option>Lead</option><option>Auto-belay</option></select></div>
      <div><label for="grade">Grade</label><select id="grade" required></select></div>
    </div>

    <label for="holdColor">Hold colour</label>
    <select id="holdColor">
      <option value="">— Select —</option>
      <option value="#e5484d">Red</option><option value="#ff7a1a">Orange</option><option value="#f5d90a">Yellow</option>
      <option value="#30a46c">Green</option><option value="#6ee7c5">Mint</option><option value="#3e63dd">Blue</option><option value="#8e4ec6">Purple</option>
      <option value="#e93d82">Pink</option><option value="#111111">Black</option><option value="#f5f5f5">White</option>
      <option value="#8d6e63">Brown</option>
    </select>

    <label>Route style (select all that apply)</label>
    <div class="chips" id="styleChips"></div>

    <label>Rating</label>
    <div class="stars" id="stars"></div>

    <label for="reviewText">Review</label>
    <textarea id="reviewText" placeholder="How did it feel? Crux, sandbagged or soft, tips for the sequence..." required></textarea>

    <label>Beta video</label>
    <div class="file-drop" id="fileDrop">
      📹 Click or drop a video here<br><small>MP4 / MOV / WebM · max 50 MB</small>
      <input type="file" id="video" accept="video/*" hidden />
    </div>
    <video id="videoPreview" controls playsinline></video>

    <button type="submit" class="btn-primary" id="submitBtn">Publish review</button>
  </form>

  <section>
    <div class="filters">
      <input type="text" id="q" placeholder="🔍 Search route, gym, area, review..." />
      <select id="fCity"><option value="">All cities</option></select>
      <select id="fType"><option value="">All types</option><option>Boulder</option><option>Top rope</option><option>Lead</option><option>Auto-belay</option></select>
      <select id="fStyle"><option value="">All styles</option></select>
      <select id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="rating">Top rated</option></select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}

/* ---------- Auth ---------- */
let tbSignUp = false;
function tbLoginMode(signUp){
  tbSignUp = signUp;
  $("tbLoginTitle").textContent = signUp ? "Sign up" : "Log in";
  $("tbLoginSubmit").textContent = signUp ? "Sign up" : "Log in";
  $("tbLoginSwitch").textContent = signUp ? "or, log in" : "or, sign up";
  $("tbLoginName").style.display = signUp ? "" : "none";
  $("tbLoginName").required = signUp;
  $("tbLoginPw").autocomplete = signUp ? "new-password" : "current-password";
  $("tbLoginMsg").textContent = "";
}
function tbOpenLogin(signUp = false){
  $("tbSidebar").classList.remove("open");
  tbLoginMode(signUp);
  $("tbLoginModal").classList.add("show");
  setTimeout(() => $(signUp ? "tbLoginName" : "tbLoginEmail").focus(), 0);
}
$("tbLoginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("tbLoginEmail").value.trim(), password = $("tbLoginPw").value, username = $("tbLoginName").value.trim();
  if (tbSignUp && username.length < 3) return tbMsg("tbLoginMsg", "Username must be at least 3 characters", false);
  const btn = $("tbLoginSubmit"); btn.disabled = true;
  const { data, error } = tbSignUp
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) return tbMsg("tbLoginMsg", error.message, false);
  if (tbSignUp && !data.session) return tbMsg("tbLoginMsg", "Check your email to confirm your account, then log in.", true);
  if (tbSignUp) { // save the chosen username to the profile
    const { error: pErr } = await sb.from("profiles").upsert({ id: data.user.id, username, updated_at: new Date().toISOString() });
    if (pErr) toast(pErr.code === "23505" ? "That username is taken, change it in Settings" : pErr.message);
    else { await tbLoadProfile(); render(); }
  }
  $("tbLoginPw").value = "";
  $("tbLoginModal").classList.remove("show");
  toast(tbSignUp ? "Welcome to ThaiBeta! 🧗" : "Logged in");
});
sb.auth.onAuthStateChange((_event, session) => {
  user = session?.user ?? null;
  setTimeout(() => { render(); tbLoadProfile(); }, 0);   // avoid calling Supabase inside the callback
});

/* ---------- Form setup ---------- */
let rating = 0, selectedStyles = new Set(), videoFile = null;

$("city").innerHTML = CITIES.map(c => `<option>${c}</option>`).join("");
$("fCity").innerHTML += CITIES.map(c => `<option>${c}</option>`).join("");
$("fStyle").innerHTML += STYLES.map(s => `<option>${s}</option>`).join("");
$("gym").innerHTML = `<option value="">— Select gym —</option>` + GYMS.map(g => `<option>${g}</option>`).join("") + `<option value="__other">Other (type your own)</option>`;
function toggleGymOther(){
  const o = $("gym").value === "__other";
  $("gymOther").style.display = o ? "block" : "none";
  $("gymOther").required = o;
  if (!o) $("gymOther").value = "";
}
$("gym").addEventListener("change", toggleGymOther);

function fillGrades(){ $("grade").innerHTML = GRADES[$("type").value].map(g => `<option>${g}</option>`).join(""); }
$("type").addEventListener("change", fillGrades); fillGrades();

$("styleChips").innerHTML = STYLES.map(s => `<span class="chip" data-style="${s}">${s}</span>`).join("");
$("styleChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  const s = chip.dataset.style;
  selectedStyles.has(s) ? selectedStyles.delete(s) : selectedStyles.add(s);
  chip.classList.toggle("active");
});

function drawStars(){ $("stars").innerHTML = [1,2,3,4,5].map(i => `<span data-v="${i}" class="${i <= rating ? "on" : ""}">★</span>`).join(""); }
$("stars").addEventListener("click", e => { if (e.target.dataset.v) { rating = +e.target.dataset.v; drawStars(); } });
drawStars();

function setVideo(file){
  if (!file) return;
  if (!file.type.startsWith("video/")) return toast("Please choose a video file");
  if (file.size > MAX_VIDEO_MB * 1024 * 1024) return toast(`Video must be under ${MAX_VIDEO_MB} MB`);
  videoFile = file;
  const p = $("videoPreview"); p.src = URL.createObjectURL(file); p.style.display = "block";
}
$("fileDrop").addEventListener("click", () => $("video").click());
$("video").addEventListener("change", e => setVideo(e.target.files[0]));
$("fileDrop").addEventListener("dragover", e => e.preventDefault());
$("fileDrop").addEventListener("drop", e => { e.preventDefault(); setVideo(e.dataTransfer.files[0]); });

/* ---------- Submit (upload video → insert row) ---------- */
$("reviewForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!user) return tbOpenLogin();
  if (!rating) return toast("Please give the route a rating ★");
  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "Publishing...";
  try {
    let video_path = null;
    if (videoFile) {
      const ext = (videoFile.name.split(".").pop() || "mp4").toLowerCase();
      video_path = `${user.id}/${crypto.randomUUID()}.${ext}`;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(video_path, videoFile, { contentType: videoFile.type });
      if (upErr) throw upErr;
    }
    const hc = $("holdColor");
    const { error } = await sb.from("reviews").insert({
      reviewer: $("reviewer").value.trim(),
      city: $("city").value,
      gym: $("gym").value === "__other" ? $("gymOther").value.trim() : $("gym").value,
      area: $("area").value.trim(),
      route_name: $("routeName").value.trim(),
      type: $("type").value,
      grade: $("grade").value,
      hold_color: hc.value || null,
      hold_color_name: hc.value ? hc.selectedOptions[0].text : null,
      styles: [...selectedStyles],
      rating,
      review_text: $("reviewText").value.trim(),
      video_path
    });
    if (error) throw error;
    toast("Review published! 🧗");
    resetForm();
    render();
  } catch (err) {
    console.error(err);
    toast("Could not publish: " + (err.message || "unknown error"));
  } finally {
    btn.disabled = false; btn.textContent = "Publish review";
  }
});

function resetForm(){
  const keepName = $("reviewer").value;
  $("reviewForm").reset(); $("reviewer").value = keepName;
  fillGrades(); toggleGymOther(); rating = 0; drawStars(); selectedStyles.clear();
  document.querySelectorAll(".chip.active").forEach(c => c.classList.remove("active"));
  videoFile = null; $("videoPreview").removeAttribute("src"); $("videoPreview").style.display = "none";
}

/* ---------- Load + render ---------- */
async function loadReviews(){
  const { data, error } = await sb.from("reviews").select("*").order("created_at", { ascending: false }).limit(300);
  if (error) { console.error(error); toast("Could not load reviews: " + error.message); return []; }

  // Get the username + photo of everyone who posted these reviews
  const ids = [...new Set(data.map(r => r.user_id).filter(Boolean))];
  if (ids.length) {
    const { data: profs, error: pErr } = await sb.from("profiles").select("id, username, avatar_path, updated_at").in("id", ids);
    if (pErr) console.error(pErr);
    (profs || []).forEach(p => profilesById[p.id] = p);
  }

  return data.map(r => ({
    ...r,
    routeName: r.route_name, holdColor: r.hold_color, holdColorName: r.hold_color_name,
    text: r.review_text, styles: r.styles || [], createdAt: Date.parse(r.created_at),
    video: r.video_path ? sb.storage.from(BUCKET).getPublicUrl(r.video_path).data.publicUrl : null
  }));
}

async function render(){
  cache = await loadReviews();
  const all = cache;


  const q = $("q").value.toLowerCase().trim();
  const fCity = $("fCity").value, fType = $("fType").value, fStyle = $("fStyle").value, sort = $("sort").value;

  const list = all.filter(r =>
    (!fCity || r.city === fCity) && (!fType || r.type === fType) && (!fStyle || r.styles.includes(fStyle)) &&
    (!q || [r.routeName, r.gym, r.area, r.text, r.reviewer].join(" ").toLowerCase().includes(q))
  ).sort((a, b) =>
    sort === "old" ? a.createdAt - b.createdAt :
    sort === "rating" ? b.rating - a.rating || b.createdAt - a.createdAt :
    b.createdAt - a.createdAt);

  const avg = list.length ? (list.reduce((s, r) => s + r.rating, 0) / list.length).toFixed(1) : "–";
  $("stats").textContent = `${list.length} review(s) · ${list.filter(r => r.video).length} beta video(s) · avg rating ${avg}★`;

  if (!list.length) { $("feed").innerHTML = `<div class="empty">No reviews yet. Send a route and post the first beta! 💪</div>`; return; }

  $("feed").innerHTML = list.map(r => {
    const media = r.video ? tbVideoHtml(r.video, r) : `<div class="no-video">No beta video uploaded</div>`;
    const hold = r.holdColor ? `<span class="hold-dot" style="background:${esc(r.holdColor)}"></span>${esc(r.holdColorName)} holds · ` : "";
    const mine = user && r.user_id === user.id;
    return `
      <article class="card">
        ${media}
        <div class="card-body">
          <div class="card-title"><h3>${esc(r.routeName)}</h3><span class="grade">${esc(r.grade)}</span></div>
          <div class="meta">📍 <strong>${esc(r.gym)}</strong>, ${esc(r.city)}<br>🧱 ${esc(r.area)}<br>${hold}${esc(r.type)}</div>
          <div style="color:var(--accent-2)">${"★".repeat(r.rating)}<span style="color:#4a3d34">${"★".repeat(5 - r.rating)}</span></div>
          ${r.styles.length ? `<div class="tags">${r.styles.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>` : ""}
          <div class="review-text">${esc(r.text)}</div>
          <div class="card-foot">
            <span>by ${byUser(r)} · ${new Date(r.createdAt).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</span>
            ${mine ? `<button class="btn-ghost" data-del="${esc(r.id)}">Delete</button>` : ""}
          </div>
        </div>
      </article>`;
  }).join("");
}

// Small photo + name after "by" — click either to open that person's profile
function byUser(r){
  const p = profilesById[r.user_id];
  const name = p?.username || r.reviewer;
  if (!r.user_id) return esc(name);
  return `<button type="button" class="by-user" data-user="${esc(r.user_id)}" title="View profile">` +
         `<img src="${esc(avatarUrl(p))}" alt=""><span>${esc(name)}</span></button>`;
}

$("feed").addEventListener("click", async e => {
  const who = e.target.closest("[data-user]");
  if (who) return tbShowProfile(who.dataset.user);
  const id = e.target.dataset.del;
  if (!id || !confirm("Delete this review?")) return;
  const rv = cache.find(r => r.id === id);
  const { error } = await sb.from("reviews").delete().eq("id", id);
  if (error) return toast("Delete failed: " + error.message);
  if (rv?.video_path) await sb.storage.from(BUCKET).remove([rv.video_path]);
  toast("Review deleted");
  render();
});

["q","fCity","fType","fStyle","sort"].forEach(id => $(id).addEventListener(id === "q" ? "input" : "change", render));

/* =====================================================================
   NEW: Sidebar — Profile (name, photo, my videos) + Settings
   Needs the SQL file (profiles table + avatars bucket) run in Supabase.
   ===================================================================== */
const AVATAR_BUCKET = "avatars";
const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#2a231f"/><circle cx="20" cy="15" r="7" fill="#a99d93"/><rect x="8" y="25" width="24" height="13" rx="6" fill="#a99d93"/></svg>');
let tbProfile = null;

function tbMsg(id, text, ok){ const el = $(id); el.textContent = text; el.className = "tb-msg " + (ok ? "ok" : "err"); }
function tbOpen(id){
  if (!user) return tbOpenLogin();
  $("tbSidebar").classList.remove("open");
  if (id === "tbProfileModal") return tbShowProfile(user.id);
  $(id).classList.add("show");
}
function avatarUrl(p){
  if (!p?.avatar_path) return DEFAULT_AVATAR;
  return sb.storage.from(AVATAR_BUCKET).getPublicUrl(p.avatar_path).data.publicUrl + "?v=" + encodeURIComponent(p.updated_at || "");
}

// Open the Profile popup for any user (yourself or someone else)
async function tbShowProfile(userId){
  const isMe = user && user.id === userId;
  let p = isMe ? tbProfile : profilesById[userId];
  if (!p) {
    const { data } = await sb.from("profiles").select("id, username, avatar_path, updated_at").eq("id", userId).maybeSingle();
    p = data;
  }
  const name = p?.username || cache.find(r => r.user_id === userId)?.reviewer || "Climber";
  $("tbProfName").textContent = name;
  $("tbProfAvatar").src = avatarUrl(p);
  $("tbAvatarEdit").style.display = isMe ? "" : "none";       // only you can change your own photo
  $("tbAvatarMsg").textContent = "";
  $("tbVidsTitle").textContent = isMe ? "My beta videos" : `${name}'s beta videos`;
  $("tbProfileModal").classList.add("show");
  tbLoadVideos(userId);
}
function tbClose(id){
  if (id === "tbLoginModal" && !user) return; // must log in first $(id).classList.remove("show"); }

async function tbLoadProfile(){
  $("tbLogoutBtn").style.display = user ? "" : "none";
  $("tbLoginBtn").style.display = user ? "none" : "";
  document.body.classList.toggle("tb-gated", !user); // blur the site until logged in
  if (user) $("tbLoginModal").classList.remove("show"); else if (!$("tbLoginModal").classList.contains("show")) tbOpenLogin();
  if (!user){
    tbProfile = null;
    $("tbSideName").textContent = "Guest";
    $("tbSideAvatar").src = DEFAULT_AVATAR;
    return;
  }
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (error) console.error(error);
  tbProfile = data || { id: user.id, username: user.email.split("@")[0], avatar_path: null };

  const name = tbProfile.username || user.email.split("@")[0];
  const avatar = tbProfile.avatar_path
    ? sb.storage.from(AVATAR_BUCKET).getPublicUrl(tbProfile.avatar_path).data.publicUrl + "?t=" + Date.now()
    : DEFAULT_AVATAR;

  $("tbSideName").textContent = name;
  $("tbProfName").textContent = name;
  $("tbNewName").value = name;
  $("tbSideAvatar").src = avatar;
  $("tbProfAvatar").src = avatar;
  if (!$("reviewer").value) $("reviewer").value = name;   // pre-fill "Your name" in the review form
}

// Upload / replace profile photo → avatars/<user id>/avatar.<ext>
$("tbAvatarFile").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  if (!file.type.startsWith("image/")) return tbMsg("tbAvatarMsg", "Please choose an image", false);
  if (file.size > 5 * 1024 * 1024) return tbMsg("tbAvatarMsg", "Photo must be under 5 MB", false);
  tbMsg("tbAvatarMsg", "Uploading…", true);
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${user.id}/avatar.${ext}`;
  const up = await sb.storage.from(AVATAR_BUCKET).upload(path, file, { upsert: true, contentType: file.type });
  if (up.error) return tbMsg("tbAvatarMsg", up.error.message, false);
  const { error } = await sb.from("profiles").upsert({ id: user.id, avatar_path: path, updated_at: new Date().toISOString() });
  if (error) return tbMsg("tbAvatarMsg", error.message, false);
  e.target.value = "";
  tbMsg("tbAvatarMsg", "Photo updated!", true);
  await tbLoadProfile();
  $("tbProfAvatar").src = avatarUrl(tbProfile);
  render();   // refresh the little photos on the review cards
});

// Show the videos this user uploaded with their reviews
async function tbLoadVideos(userId){
  const box = $("tbMyVideos");
  box.innerHTML = "<small>Loading…</small>";
  const { data, error } = await sb.from("reviews")
    .select("*")
    .eq("user_id", userId)
    .not("video_path", "is", null)
    .order("created_at", { ascending: false });
  if (error) { box.innerHTML = `<small>${esc(error.message)}</small>`; return; }
  if (!data.length) { box.innerHTML = "<small>No beta videos yet.</small>"; return; }
  box.innerHTML = data.map(r => `
  <div>
    ${tbVideoHtml(sb.storage.from(BUCKET).getPublicUrl(r.video_path).data.publicUrl, r)}
    <small>${esc([r.route_name, r.grade, r.gym].filter(Boolean).join(" · "))}</small>
  </div>`).join("");
}

// Video + beta details box. Full screen goes through our ⛶ button (Chrome's own full screen
// button can't show anything on top of the video, so it is hidden).
function tbVideoHtml(url, r){
  const title = [r.route_name && r.route_name !== "-" ? r.route_name : "", r.grade, r.type].filter(Boolean).join(" · ");
  const where = [r.gym, r.area, r.city].filter(Boolean).join(" · ");
  const stars = Number(r.rating) > 0 ? "★".repeat(Number(r.rating)) : "";
  const styles = Array.isArray(r.styles) ? r.styles.join(", ") : (r.styles || "");
  const extra = [r.hold_color_name ? r.hold_color_name + " holds" : "", stars, styles].filter(Boolean).join(" · ");
  return `<div class="tb-vid">
    <video src="${esc(url)}" controls controlslist="nofullscreen" playsinline preload="metadata"></video>
    <button type="button" class="tb-fs" title="Full screen" aria-label="Full screen">⛶</button>
    <div class="tb-vid-info">
      <b>${esc(title || "Beta video")}</b>
      ${where ? `<div>${esc(where)}</div>` : ""}
      ${extra ? `<div>${esc(extra)}</div>` : ""}
    </div>
  </div>`;
}
function tbVidFull(box){
  if (document.fullscreenElement || document.webkitFullscreenElement)
    return void (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
  const vid = box.querySelector("video");
  if (box.requestFullscreen) box.requestFullscreen();
  else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
  else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); // iPhone: plain video full screen
}
document.addEventListener("click", e => { const b = e.target.closest(".tb-fs"); if (b) tbVidFull(b.closest(".tb-vid")); });
document.addEventListener("dblclick", e => { const vid = e.target.closest(".tb-vid video"); if (vid) tbVidFull(vid.closest(".tb-vid")); });

async function tbSaveUsername(){
  const name = $("tbNewName").value.trim();
  if (name.length < 3) return tbMsg("tbNameMsg", "Username must be at least 3 characters", false);
  const { error } = await sb.from("profiles").upsert({ id: user.id, username: name, updated_at: new Date().toISOString() });
  if (error) return tbMsg("tbNameMsg", error.code === "23505" ? "That username is already taken" : error.message, false);
  tbMsg("tbNameMsg", "Username saved!", true);
  tbLoadProfile();
  render();   // refresh the names on the review cards
}

async function tbChangePassword(){
  const cur = $("tbCurPw").value, pw = $("tbNewPw").value, pw2 = $("tbNewPw2").value;
  if (pw.length < 6) return tbMsg("tbPwMsg", "New password must be at least 6 characters", false);
  if (pw !== pw2) return tbMsg("tbPwMsg", "New passwords don't match", false);
  const check = await sb.auth.signInWithPassword({ email: user.email, password: cur });   // confirm current password
  if (check.error) return tbMsg("tbPwMsg", "Current password is wrong", false);
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) return tbMsg("tbPwMsg", error.message, false);
  ["tbCurPw", "tbNewPw", "tbNewPw2"].forEach(id => $(id).value = "");
  tbMsg("tbPwMsg", "Password changed!", true);
}

async function tbLogout(){
  await sb.auth.signOut();
  $("tbSidebar").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { tbClose("tbProfileModal"); tbClose("tbSettingsModal"); tbClose("tbLoginModal"); $("tbSidebar").classList.remove("open"); }
});
</script>
